<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Quetzal ☕ — Never Down</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --aws: #ff9900; --gcp: #4285f4; --bg: #1a120b; --card: #241811; --line: #3a2a1c; --txt: #f5e9dc; --muted: #b99b80; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); line-height: 1.5; }
  header { background: linear-gradient(135deg, #2a1a0f, #3a2413); padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo { font-size: 2.2em; }
  .brand h1 { font-size: 1.5em; font-weight: 800; letter-spacing: -0.5px; }
  .brand p { font-size: 0.8em; color: var(--muted); }
  /* Badge de nube — la estrella del demo */
  .served { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; font-weight: 700; border: 2px solid var(--line); background: #1c130c; transition: all .4s ease; }
  .served .dot { width: 12px; height: 12px; border-radius: 50%; background: #555; }
  .served.aws { border-color: var(--aws); box-shadow: 0 0 24px rgba(255,153,0,0.25); }
  .served.aws .dot { background: var(--aws); box-shadow: 0 0 10px var(--aws); }
  .served.gcp { border-color: var(--gcp); box-shadow: 0 0 24px rgba(66,133,244,0.3); }
  .served.gcp .dot { background: var(--gcp); box-shadow: 0 0 10px var(--gcp); }
  .served.down { border-color: #ef4444; box-shadow: 0 0 24px rgba(239,68,68,0.3); }
  .served.down .dot { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .served .label { font-size: 0.7em; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .served .cloud { font-size: 1.05em; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px; display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
  @media(max-width: 820px){ .wrap { grid-template-columns: 1fr; } }
  h2 { font-size: 1.1em; margin-bottom: 14px; color: var(--txt); display: flex; align-items: center; gap: 8px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 480px){ .menu-grid { grid-template-columns: 1fr; } }
  .prod { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .prod .info h3 { font-size: 1em; font-weight: 700; }
  .prod .info .price { color: var(--muted); font-size: 0.9em; }
  .prod button { background: var(--aws); color: #1a120b; border: none; border-radius: 8px; width: 34px; height: 34px; font-size: 1.3em; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .prod button:hover { filter: brightness(1.1); }
  aside { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; height: fit-content; position: sticky; top: 100px; }
  .cart-line { display: flex; justify-content: space-between; font-size: 0.9em; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .cart-empty { color: var(--muted); font-size: 0.9em; text-align: center; padding: 20px 0; }
  .total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2em; margin: 14px 0; }
  input { width: 100%; background: #1c130c; border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--txt); margin-bottom: 12px; }
  .btn-order { width: 100%; background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 1em; font-weight: 700; cursor: pointer; }
  .btn-order:hover { filter: brightness(1.08); }
  .btn-order:disabled { opacity: .5; cursor: not-allowed; }
  .orders { margin-top: 28px; }
  .order-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .order-item .who { font-weight: 700; }
  .order-item .meta { font-size: 0.8em; color: var(--muted); }
  .order-right { display: flex; align-items: center; gap: 10px; }
  .btn-del { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; width: 30px; height: 30px; font-size: 1em; cursor: pointer; flex-shrink: 0; }
  .btn-del:hover { background: rgba(239,68,68,0.25); }
  .cloud-tag { font-size: 0.72em; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .cloud-tag.aws { background: rgba(255,153,0,0.15); color: var(--aws); }
  .cloud-tag.gcp { background: rgba(66,133,244,0.18); color: #7aa7f7; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #241811; border: 1px solid var(--line); padding: 14px 22px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">☕</div>
    <div>
      <h1>Café Quetzal</h1>
      <p>Pedidos online · Never Down</p>
    </div>
  </div>
  <div id="served" class="served">
    <div class="dot"></div>
    <div>
      <div class="label">Atendido por</div>
      <div class="cloud" id="served-cloud">Conectando…</div>
    </div>
  </div>
</header>

<div class="wrap">
  <main>
    <h2>📋 Menú</h2>
    <div class="menu-grid" id="menu"></div>

    <div class="orders">
      <h2>🧾 Pedidos recientes</h2>
      <div id="orders"></div>
    </div>
  </main>

  <aside>
    <h2>🛒 Tu pedido</h2>
    <div id="cart"><div class="cart-empty">Aún no has agregado nada</div></div>
    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <input id="customer" placeholder="Tu nombre" value="">
    <button class="btn-order" id="btn-order" disabled>Ordenar</button>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
  // El front (cafequetzal.hvillavicencio.com) llama a la API en su propio
  // subdominio (cafeapi.hvillavicencio.com). Route 53 hace el failover del
  // subdominio de API a GCP; el front no necesita saber en qué nube está.
  // Para pruebas locales se puede forzar el backend con ?api=<endpoint>.
  const params = new URLSearchParams(location.search);
  const API = (params.get('api') || 'https://apicafequetzal.hvillavicencio.com').replace(/\/$/, '');

  const cart = {};
  let menu = [];

  const $ = (id) => document.getElementById(id);
  const money = (n) => '$' + Number(n).toFixed(2);

  function setServedBy(servedBy) {
    const el = $('served');
    const label = $('served-cloud');
    el.classList.remove('aws', 'gcp', 'down');
    if (servedBy && servedBy.startsWith('aws')) { el.classList.add('aws'); label.textContent = 'AWS ☁️ (primario)'; }
    else if (servedBy && servedBy.startsWith('gcp')) { el.classList.add('gcp'); label.textContent = 'GCP ☁️ (standby)'; }
    else { el.classList.add('down'); label.textContent = '⚠️ Sin respuesta'; }
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function loadMenu() {
    try {
      const r = await fetch(API + '/menu');
      const d = await r.json();
      menu = d.menu; setServedBy(d.served_by);
      $('menu').innerHTML = menu.map(p => `
        <div class="prod">
          <div class="info"><h3>${p.name}</h3><div class="price">${money(p.price)}</div></div>
          <button onclick="addToCart('${p.sku}')">+</button>
        </div>`).join('');
    } catch (e) { setServedBy(null); }
  }

  window.addToCart = (sku) => {
    cart[sku] = (cart[sku] || 0) + 1;
    renderCart();
  };

  function renderCart() {
    const box = $('cart');
    const skus = Object.keys(cart).filter(s => cart[s] > 0);
    if (!skus.length) { box.innerHTML = '<div class="cart-empty">Aún no has agregado nada</div>'; $('total').textContent = '$0.00'; $('btn-order').disabled = true; return; }
    let total = 0;
    box.innerHTML = skus.map(sku => {
      const p = menu.find(m => m.sku === sku);
      const sub = p.price * cart[sku]; total += sub;
      return `<div class="cart-line"><span>${cart[sku]}× ${p.name}</span><span>${money(sub)}</span></div>`;
    }).join('');
    $('total').textContent = money(total);
    $('btn-order').disabled = false;
  }

  $('btn-order').onclick = async () => {
    const items = Object.keys(cart).filter(s => cart[s] > 0).map(sku => ({ sku, qty: cart[sku] }));
    if (!items.length) return;
    const customer = $('customer').value.trim() || 'Anónimo';
    $('btn-order').disabled = true;
    try {
      const r = await fetch(API + '/orders', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ customer, items })
      });
      const d = await r.json();
      setServedBy(d.served_by);
      toast(`Pedido #${d.order.id} recibido — ${d.served_by}`);
      for (const k in cart) delete cart[k];
      renderCart(); loadOrders();
    } catch (e) { toast('⚠️ No se pudo enviar el pedido'); $('btn-order').disabled = false; }
  };

  async function loadOrders() {
    try {
      const r = await fetch(API + '/orders');
      const d = await r.json();
      setServedBy(d.served_by);
      $('orders').innerHTML = (d.orders || []).map(o => {
        const cloud = (o.served_by || '').startsWith('aws') ? 'aws' : 'gcp';
        const cloudName = cloud === 'aws' ? 'AWS' : 'GCP';
        return `<div class="order-item">
          <div><div class="who">#${o.id} · ${o.customer}</div>
          <div class="meta">${(o.items||[]).map(i => i.qty+'× '+i.name).join(', ')} — ${money(o.total)}</div></div>
          <div class="order-right">
            <span class="cloud-tag ${cloud}">${cloudName}</span>
            <button class="btn-del" title="Borrar pedido" onclick="deleteOrder('${o.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('') || '<div class="cart-empty">Sin pedidos todavía</div>';
    } catch (e) {}
  }

  window.deleteOrder = async (id) => {
    if (!confirm('¿Borrar el pedido #' + id + '?')) return;
    try {
      const r = await fetch(API + '/orders/' + id, { method: 'DELETE' });
      const d = await r.json();
      setServedBy(d.served_by);
      toast('Pedido #' + id + ' borrado');
      loadOrders();
    } catch (e) { toast('⚠️ No se pudo borrar'); }
  };

  // Health poll: mantiene el badge actualizado en vivo (clave durante el failover)
  async function pollHealth() {
    try { const r = await fetch(API + '/health', { cache: 'no-store' }); const d = await r.json(); setServedBy(d.served_by); }
    catch (e) { setServedBy(null); }
  }

  loadMenu(); loadOrders(); pollHealth();
  setInterval(pollHealth, 3000);
  setInterval(loadOrders, 5000);
</script>
</body>
</html>
